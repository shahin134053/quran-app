name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias alshahin_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ShahinQuranSecure2026" \
              -keypass "ShahinQuranSecure2026" \
              -dname "CN=Al-Shahin Quran, OU=Mobile, O=Al-Shahin, L=Dhaka, ST=Dhaka, C=BD"
          fi

      - name: Build Signed Release APK and App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Prepare APK, AAB and iOS Web Bundle for Release
        run: |
          mkdir -p release-output
          # Copy Release APK (or any built apk)
          find android/app/build/outputs/apk -name "*.apk" | head -n 1 | xargs -I {} cp {} release-output/Al-Shahin-Quran-release.apk || true
          
          # Copy Release AAB for Google Play Store (or any built aab)
          find android/app/build/outputs/bundle -name "*.aab" | head -n 1 | xargs -I {} cp {} release-output/Al-Shahin-Quran-release.aab || true
          
          # 3. Create iOS & Standalone Web App Distribution (PWA installable package for iPhone & Safari users)
          if [ -d "dist" ]; then
            (cd dist && zip -r ../release-output/Al-Shahin-Quran-iOS-WebApp.zip .)
          fi

          # Release metadata & instructions file
          cat << 'EOF' > release-output/README_RELEASE.txt
          =========================================
          Al-Shahin Quran App Version 2.0 (Release)
          =========================================
          1. Al-Shahin-Quran-release.apk: Android Direct Install Signed APK
          2. Al-Shahin-Quran-release.aab: Google Play Console Release App Bundle
          3. Al-Shahin-Quran-iOS-WebApp.zip: iOS Safari / Standalone PWA Offline package
          
          Features:
          - Daily Waqt Duas & Hisnul Muslim with Audio Recitation (Arabic first) & Spoken Translation.
          - Instant translation toggle (Bengali / English / Hindi).
          - Live Qibla, Prayer Timings, Surahs, Ramadan Hub, and Friday Jummah Hub.
          EOF
          ls -la release-output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Shahin-Quran-release-artifacts
          path: release-output/
          if-no-files-found: warn

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v3.0.0
          name: "Al-Shahin Quran v3.0.0 (Official App Store, Play Store & Uptodown Release)"
          body: |
            ## 📖 Al-Shahin Quran Mobile App v3.0.0 (Official Production Release)
            
            ### 📥 ডাউনলোড ও পাবলিশিং ফাইলসমূহ (৩টি ভার্সন):
            1. **`Al-Shahin-Quran-release.apk`**: সরাসরি যেকোনো অ্যান্ড্রয়েড ফোনে ইনস্টল করার জন্য অফিসিয়াল সাইনড রিলিজ APK (~৪.২ MB)।
            2. **`Al-Shahin-Quran-release.aab`**: গুগল প্লে স্টোর (Google Play Console) ও অ্যাপ স্টোরে আপলোডের জন্য সাইনড অ্যান্ড্রয়েড অ্যাপ বান্ডেল (Android App Bundle)।
            3. **`Al-Shahin-Quran-iOS-WebApp.zip`**: আইফোন (iOS Safari / PWA) ও পিসির জন্য অফলাইন ইনস্টলেবল প্যাকেজ।
            
            ---
            
            ### 🌟 সংস্করণ ৩.০.০ (Version 3.0.0) নতুন আকর্ষণীয় বৈশিষ্ট্য ও পরিবর্তনসমূহ:
            - 🧠 **স্মার্ট হিফজ ও আত্ম-পরীক্ষা মোড (Hifz & Memorization Companion):** আয়াত ব্লার করে নিজের মেধা পরীক্ষা, রিপিট অডিও লুপ এবং সূরাভিত্তিক হিফজ ট্র্যাকার।
            - 🔍 **বিষয়ভিত্তিক আল-কুরআন অনুসন্ধান (Semantic Topic Search):** সবর, মা-বাবা, সালাত, জান্নাত, ক্ষমা, দান-সদকা ইত্যাদি বিষয়ের ওপর ভিত্তি করে আয়াত ও তাফসির অনুসন্ধান।
            - 🎨 **অনন্য কাস্টম ব্র্যান্ডিং ও ডিজাইন:** নিজস্ব প্যাকেজ নেম (`com.alshahin.quranapp`), অ্যাডাপ্টিভ কাস্টম আইকন, স্প্ল্যাশ স্ক্রিন ও এমারেল্ড-গোল্ড ডার্ক থিম।
            - 🎧 **দ্বৈত অডিও তিলাওয়াত ও অনুবাদ:** আরবি তিলাওয়াতের সাথে সাথেই নির্বাচিত ভাষায় (বাংলা/ইংরেজি/হিন্দি) ভয়েস অনুবাদ প্লেব্যাক।
            - 🕌 **পাঁচ ওয়াক্ত সালাতের সময়সূচী, জিপিএস ও ৩ডি কিবলা কম্পাস:** নির্ভুল লোকেশন ও জুমার আমল হাব।
            - 🌙 **রমাদান সেহরি ও ইফতার কাউন্টডাউন:** প্রতিদিনের সেহরি-ইফতার সময়সূচি ও অফলাইন জিকির তাসবীহ।
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-output/Al-Shahin-Quran-release.apk
            release-output/Al-Shahin-Quran-release.aab
            release-output/Al-Shahin-Quran-iOS-WebApp.zip
            release-output/README_RELEASE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
