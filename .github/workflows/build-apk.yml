name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-output/Al-Shahin-Quran-debug.apk \;
          ls -la release-output/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Shahin-Quran-debug-apk
          path: release-output/Al-Shahin-Quran-debug.apk

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Al-Shahin Quran v1.0.0 Release"
          body: |
            ## 📱 Al-Shahin Quran Android App
            
            Android ফোনে সরাসরি ইনস্টল করার জন্য নিচের **`Al-Shahin-Quran-debug.apk`** ফাইলটি ডাউনলোড করে ইনস্টল করুন।
            
            ### ✨ যা যা রয়েছে:
            - পূর্ণাঙ্গ কুরআন তিলাওয়াত ও অডিও প্লেয়ার
            - বাংলা ও ইংরেজি অনুবাদসহ বিস্তারিত তাফসির
            - নামাজের ওয়াক্ত ও রমজান ক্যালেন্ডার
            - ডিজিটাল তসবিহ ও দোয়া কালেকশন
          draft: false
          prerelease: false
          files: release-output/Al-Shahin-Quran-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
