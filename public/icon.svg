<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Soft Glow -->
    <radialGradient id="goldCenterGlow" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="goldGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Outer Golden Border Inset -->
  <rect x="18" y="18" width="476" height="476" rx="98" ry="98" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-opacity="0.4" />
  <rect x="26" y="26" width="460" height="460" rx="90" ry="90" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Central Ambient Light -->
  <circle cx="256" cy="240" r="180" fill="url(#emeraldGlow)" />
  <circle cx="256" cy="230" r="120" fill="url(#goldCenterGlow)" />

  <!-- 8-Pointed Islamic Geometric Star (Rub el Hizb) Background -->
  <g transform="translate(256, 236)" filter="url(#goldGlowFilter)">
    <!-- Square 1 -->
    <rect x="-140" y="-140" width="280" height="280" rx="20" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85" />
    <!-- Square 2 Rotated 45 deg -->
    <rect x="-140" y="-140" width="280" height="280" rx="20" transform="rotate(45)" fill="#064e3b" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.9" />
    <!-- Inner Concentric Circle -->
    <circle r="124" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 4" />
    <circle r="114" fill="#022c22" fill-opacity="0.95" />
  </g>

  <!-- Open Quran Book Motif -->
  <g transform="translate(256, 240)" filter="url(#cardShadow)">
    <!-- Quran Book Stand (Rihal) Underneath -->
    <path d="M-84 80 L-110 114 L-60 114 L-20 84 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M84 80 L110 114 L60 114 L20 84 Z" fill="url(#goldGrad)" opacity="0.9" />
    <circle cx="0" cy="94" r="8" fill="url(#goldGrad)" />

    <!-- Open Book Pages (Left & Right Spreads) -->
    <!-- Left Page Outer Shadow -->
    <path d="M-6 48 C-45 42 -85 54 -102 30 C-102 -15 -102 -50 -102 -50 C-85 -28 -45 -38 -6 -32 Z" fill="#064e3b" opacity="0.6" />
    <!-- Right Page Outer Shadow -->
    <path d="M6 48 C45 42 85 54 102 30 C102 -15 102 -50 102 -50 C85 -28 45 -38 6 -32 Z" fill="#064e3b" opacity="0.6" />

    <!-- Left Book Page (Golden Cream) -->
    <path d="M-4 54 C-42 48 -84 60 -106 38 C-106 -12 -106 -48 -106 -48 C-84 -26 -42 -36 -4 -30 Z" fill="#fef9c3" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Left Page Inner Lines (Text Illusion) -->
    <line x1="-88" y1="-22" x2="-22" y2="-12" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-88" y1="-4" x2="-22" y2="4" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-88" y1="14" x2="-22" y2="22" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="-82" y1="32" x2="-28" y2="38" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Right Book Page (Golden Cream) -->
    <path d="M4 54 C42 48 84 60 106 38 C106 -12 106 -48 106 -48 C84 -26 42 -36 4 -30 Z" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Right Page Inner Lines (Text Illusion) -->
    <line x1="22" y1="-12" x2="88" y2="-22" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="22" y1="4" x2="88" y2="-4" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="22" y1="22" x2="88" y2="14" stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="28" y1="38" x2="82" y2="32" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Book Center Spine & Golden Ribbon -->
    <path d="M-4 -30 Q0 -25 4 -30 L4 54 Q0 60 -4 54 Z" fill="url(#goldGrad)" />
    <!-- Ribbon Bookmark -->
    <path d="M0 54 Q15 72 8 98 L-2 90 L-8 96 Q-2 72 0 54 Z" fill="#b91c1c" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Radiant Nur / Sunlight rays above Quran -->
    <circle cx="0" cy="-62" r="14" fill="url(#goldGrad)" filter="url(#goldGlowFilter)" />
    <!-- Crescent & Star on top of Quran -->
    <path d="M-8 -64 A12 12 0 0 0 10 -52 A15 15 0 0 1 -8 -64 Z" fill="#fef08a" />
    <polygon points="12,-66 14,-62 18,-62 15,-59 16,-55 12,-57 8,-55 9,-59 6,-62 10,-62" fill="#fef08a" transform="scale(0.8) translate(5, -15)" />
  </g>

  <!-- Bottom App Label: AL-SHAHIN QURAN (বাংলা / Arabic) in Gold Calligraphy Style -->
  <g transform="translate(256, 436)" text-anchor="middle">
    <!-- Arabic & Bengali text with gold gradient -->
    <text y="0" font-family="'Scheherazade New', 'Amiri', 'Tiro Bangla', 'Noto Sans Bengali', serif, sans-serif" font-size="32" font-weight="900" fill="url(#goldGrad)" letter-spacing="3">القرآن الكريم</text>
    <text y="28" font-family="'Tiro Bangla', 'Noto Sans Bengali', sans-serif" font-size="18" font-weight="700" fill="#a7f3d0" letter-spacing="2" opacity="0.95">আল-শাহীন কুরআন</text>
  </g>
</svg>
